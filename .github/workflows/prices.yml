name: Import auction prices
# Reads the Spices Board's public price table after the day's auctions and
# commits the updated feed.json, which the Elarani app downloads.
on:
  schedule:
    - cron: '30 12 * * 1-6' # 18:00 IST
    - cron: '30 15 * * 1-6' # 21:00 IST, in case the Board posts late
  workflow_dispatch:
permissions:
  contents: write
concurrency: prices
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run import-prices
      - name: Commit the new feed
        run: |
          if git diff --quiet -I '"updatedAt"' feed.json; then echo "No new auctions"; exit 0; fi
          git config user.name "elarani-bot"
          git config user.email "elarani-bot@users.noreply.github.com"
          git add feed.json
          git commit -qm "Prices $(date -u +%Y-%m-%d)"
          git push
